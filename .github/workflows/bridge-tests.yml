name: Discord WTAgent bridge tests
on:
  push:
    branches: [feat/discord-wtagent-bridge, main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile bridge.py jarvis.py test_bridge.py
      - run: python -m unittest test_bridge -v
